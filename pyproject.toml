    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph-cli[inemem,inmem]>=0.4.8",
    "langsmith>=0.14.11",
    "numpy>=2.5.4",
    "openai>=3.35.1",
